spec_version: "0.1"
name: overturemaps
title: Overture Maps
description: |-
  Overture Maps Foundation が公開するオープンな地図データのうち、日本の POI（places テーマ）、道路網（transportation テーマ）、行政区画（divisions テーマ）。毎月、Overture の最新リリースから取り直す。
  places は店舗・飲食店・医療機関・宿泊施設・公園など約290万件で、名称・カテゴリ・住所・電話番号・Web サイト・ブランド・緯度経度と、レコードごとの提供元とライセンスを持つ。
  transportation は全国の道路を交差点ごとに区切った道路網で、徒歩・自転車・車で通れるか、車の一方通行、規制速度を持つ。到達圏（徒歩 10 分圏など）や経路の計算にそのまま使える。
  divisions は都道府県・市区町村・政令市の区・町丁・字の代表点とポリゴンで、総務省の地方公共団体コードを付けてある。Overture の GERS ID と市区町村コードの対応表として、POI や建物を市区町村コードを持つ他のデータと結ぶのに使える。

  出典: Overture Maps Foundation, overturemaps.org（https://docs.overturemaps.org/attribution/）。
  Queria が places テーマから住所の国コードが JP のレコードを取り出して作成した。places.raw_place は Overture のスキーマのまま全列を持ち、places.place は主な列を平坦化したもの。
  transportation テーマは、Queria が日本の範囲の道路区間（subtype = road）を取り出し、transportation.road_edge / road_node では交差点ごとに区切り直して通れる手段を付けた。
  divisions テーマは、Queria が国コードが JP の区画を取り出し、divisions.division / division_area では都道府県名と市区町村名を総務省「全国地方公共団体コード」（Queria の lg_code データセット経由、政府標準利用規約 第2.0版）と照合してコードを付けた。

  transportation テーマは OpenStreetMap に由来し、Open Database License（ODbL 1.0）が適用される。© OpenStreetMap contributors（https://www.openstreetmap.org/copyright）。
  divisions テーマも OpenStreetMap 由来で ODbL 1.0 が適用され、一部の区画は geoBoundaries（CC BY 4.0、https://www.geoboundaries.org/）と Esri Community Maps contributors（CC BY 4.0）に由来する。
  ODbL のもとで、このデータセットの transportation スキーマと divisions スキーマも同じ ODbL で提供する。

  提供元ごとにライセンスが違う。各レコードの source_licenses 列が、そのレコードに適用されるライセンスを示す。
  Meta・Microsoft・PinMeTo・DAC など由来のデータは CDLA-Permissive-2.0、AllThePlaces 由来は CC0-1.0、Foursquare 由来は Apache-2.0。
  Foursquare 由来のデータには次の NOTICE が適用される（https://opensource.foursquare.com/places-notice-txt/）。

  © 2026 Foursquare Labs, Inc. All rights reserved.
  The Foursquare OS Places dataset (the "Data") is licensed under the Apache License, Version 2.0 (the "License"). You may not use, modify, or distribute the Data except in compliance with the License.
  As set forth more fully in the License, if you use, modify, or distribute the Data, you must: provide recipients with a copy of the License; if applicable, include prominent notices to the extent you've changed the Data; preserve attribution to Foursquare, including preserving the full content of this NOTICE.txt file.
  You may obtain a copy of the License at http://www.apache.org/licenses/LICENSE-2.0. Unless required by applicable law or agreed to in writing, the Data distributed under the License is distributed on an "AS IS" BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied. See the License for the specific language governing permissions and limitations under the License.

  Queria による変更の通知: Overture Maps Foundation が Overture のスキーマへ変換した Foursquare 由来データについて、Queria は日本のレコードの抽出と、places.place での列の選択と平坦化を行った。
