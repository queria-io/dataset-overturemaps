# この dataset.yml は fdl commit が読む（FDL の dataset.json を YAML で書いたもの）。
# 表の説明は models/ の *.table.yml に書く。表と列の型・NULL・行数は fdl commit がカタログから埋める。
# Queria だけの項目（テーマ・カバー・列の意味）は annotations.queria に書く。
name: overturemaps
title: Overture Maps
description: |-
  Overture Maps Foundation が公開するオープンな地図データのうち、日本の POI・道路網・行政区画・建物・設備・土地利用です。毎月、Overture の最新リリースから取得し直し、市区町村コードとメッシュコードを付けています。

  出典：Overture Maps Foundation, overturemaps.org。提供元ごとのライセンスと Foursquare の NOTICE は README にあります。Queria が加工したものです。
keywords:
  - POI
  - 行政区画
  - 建物
  - 市区町村
  - 地方公共団体コード
  - 道路
  - 道路網
  - 到達圏
  - 施設
  - 店舗
  - 飲食店
  - 地図
  - GIS
  - Overture Maps
  - Foursquare
homepage: https://github.com/queria-io/dataset-overturemaps
language: ja

licenses:
  - id: CDLA-Permissive-2.0
    spdx: CDLA-Permissive-2.0
    url: https://cdla.dev/permissive-2-0/
    title: Community Data License Agreement – Permissive, Version 2.0
    commercial_use: true
    share_alike: false
    attribution_required: false
  - id: Apache-2.0
    spdx: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
    title: Apache License 2.0
    commercial_use: true
    share_alike: false
    attribution_required: true
  - CC0-1.0
  - CC-BY-4.0
  - JP-GOV-STD-2.0
  - id: ODbL-1.0
    spdx: ODbL-1.0
    url: https://opendatacommons.org/licenses/odbl/1-0/
    title: Open Data Commons Open Database License 1.0
    commercial_use: true
    share_alike: true
    attribution_required: true

sources:
  - title: Overture Maps places
    path: https://docs.overturemaps.org/guides/places/
  - title: Overture Maps transportation
    path: https://docs.overturemaps.org/guides/transportation/
  - title: Overture Maps divisions
    path: https://docs.overturemaps.org/guides/divisions/
  - title: Overture Maps buildings
    path: https://docs.overturemaps.org/guides/buildings/
  - title: Overture Maps base
    path: https://docs.overturemaps.org/guides/base/
  - title: 総務省 全国地方公共団体コード
    path: https://www.soumu.go.jp/denshijiti/code.html

contributors:
  - title: Overture Maps Foundation
    path: https://overturemaps.org/
    roles: [rightsHolder]
  - title: Foursquare Labs, Inc.
    path: https://opensource.foursquare.com/os-places/
    roles: [rightsHolder]
  - title: OpenStreetMap contributors
    path: https://www.openstreetmap.org/copyright
    roles: [rightsHolder]
  - title: Microsoft
    path: https://github.com/microsoft/GlobalMLBuildingFootprints
    roles: [rightsHolder]
  - title: Shi et al.（Zenodo）
    path: https://doi.org/10.5281/zenodo.8174931
    roles: [rightsHolder]
  - title: geoBoundaries
    path: https://www.geoboundaries.org/
    roles: [rightsHolder]
  - title: Esri Community Maps contributors
    path: https://communitymaps.arcgis.com/
    roles: [rightsHolder]
  - title: 総務省
    path: https://www.soumu.go.jp/denshijiti/code.html
    roles: [rightsHolder]

spatial_coverage: [JP]
update_frequency: monthly

schemas:
  - name: places
    title: 場所（POI）
  - name: transportation
    title: 道路網
  - name: divisions
    title: 行政区画
  - name: buildings
    title: 建物
  - name: base
    title: 設備・土地利用

annotations:
  queria:
    themes: [land_climate, housing_land, transport_tourism, commerce_services]
    cover: 📍
