name: Sync

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  schedule:
    # 毎月 2 日 05:00 JST。Overture のリリースは月 1 回ほど
    - cron: "0 20 1 * *"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@main
    with:
      dataset_name: overturemaps
      # 建物（約 5,400 万棟）の取り出しとビルドが加わり、既定の 90 分では足りない見込み
      timeout_minutes: 150
    secrets: inherit
