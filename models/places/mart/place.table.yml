schema: places
name: place
title: 日本の POI
description: Overture Maps places テーマのうち、住所の国コードが JP の施設。1行が1施設で、店舗・飲食店・医療機関・宿泊施設・公園・寺社などを含む。複数の提供元が同じ施設を持つ場合、Overture が1件にまとめたうえで配布している。営業状態（operating_status）はほとんどのレコードで空なので、閉店した施設を除く用途には使えない。位置から地方公共団体コード（政令市は区）・メッシュコード（1〜3 次）と、施設が入る建物の building_id を付けたので、市区町村コードやメッシュを持つ他のデータセット、buildings.building と結合できる。
keywords:
- POI
- 施設
- 店舗
- 飲食店
- GIS
published: true
sources:
- path: https://docs.overturemaps.org/guides/places/
fields:
- name: id
  title: GERS ID
  description: Overture が施設に振る ID。リリースをまたいでも同じ施設には同じ ID が付くので、前のリリースとの差分を取るときのキーになる
- name: name
  title: 名称
  description: 提供元が登録した主たる名称。日本語とは限らない
- name: name_ja
  title: 名称（日本語）
  description: Overture が言語別に持つ名称（names.rules の variant が language のもの）のうち ja。無ければ NULL
- name: name_en
  title: 名称（英語）
  description: Overture が言語別に持つ名称（names.rules の variant が language のもの）のうち en。無ければ NULL
- name: basic_category
  title: 基本カテゴリ
  description: Overture が付ける大まかなカテゴリ（restaurant / cafe / convenience_store / hospital など）
- name: taxonomy_primary
  title: カテゴリ
  description: Overture の分類体系での主カテゴリ。basic_category より細かい
- name: taxonomy_hierarchy
  title: カテゴリの階層
  description: 主カテゴリを最上位から並べたもの。「 > 」区切り
- name: confidence
  title: 確からしさ
  description: その施設が実在する確からしさを Overture が 0〜1 で推定した値
- name: operating_status
  title: 営業状態
  description: open / permanently_closed / temporarily_closed。ほとんどのレコードで NULL
- name: brand_name
  title: ブランド名
- name: brand_wikidata
  title: ブランドの Wikidata ID
- name: address
  title: 住所
  description: 提供元が登録した住所の文字列。表記は提供元によって揃っていない
- name: locality
  title: 市区町村
- name: region
  title: 都道府県
- name: postcode
  title: 郵便番号
  semantic: { role: entity, name: postal_code }
- name: phones
  title: 電話番号
  description: 複数ある場合は半角スペース区切り
- name: websites
  title: Web サイト
  description: 複数ある場合は半角スペース区切り
- name: source_datasets
  title: 提供元
  description: このレコードの属性を提供したデータセット名（meta / Foursquare / Microsoft / AllThePlaces など）。「, 」区切り。Overture は全レコードに含まれる
- name: source_licenses
  title: ライセンス
  description: このレコードに適用されるライセンス。「, 」区切り。Apache-2.0 を含むレコードは Foursquare 由来で、データセットの説明にある NOTICE が適用される
- name: lat
  title: 緯度
- name: lon
  title: 経度
- name: pref_code
  title: 都道府県コード
  description: 2桁。施設が入る市区町村の都道府県。住所の region は多くの行で空なので、都道府県で絞るときはこちらを使う
  semantic: { role: entity, name: prefecture }
- name: lg_code
  title: 地方公共団体コード
  description: 6桁（検査数字つき）。施設の位置が入る市区町村（divisions.division_area）のコードで、政令市は区のコード。どの市区町村のポリゴンにも入らなければ NULL
  semantic: { role: entity, name: city }
- name: building_id
  title: 建物の GERS ID
  description: 施設の位置が入る建物（buildings.building）の building_id。外形が重なる建物では小さい方。建物の外にある施設や、外形の無い建物の中の施設は NULL
- name: mesh1
  title: 1 次メッシュコード
  description: 施設の位置が入る JIS X 0410 の 1 次メッシュ（約 80km 四方）
  semantic: { role: entity, name: mesh }
- name: mesh2
  title: 2 次メッシュコード
  description: 施設の位置が入る JIS X 0410 の 2 次メッシュ（約 10km 四方）
  semantic: { role: entity, name: mesh }
- name: mesh3
  title: 3 次メッシュコード
  description: 施設の位置が入る JIS X 0410 の 3 次メッシュ（基準地域メッシュ、約 1km 四方）
  semantic: { role: entity, name: mesh }
- name: geometry
  title: ジオメトリ
  description: 施設の位置を表す POINT
- name: release
  title: リリース
  description: 取り込んだ Overture のリリース名（YYYY-MM-DD.N）
