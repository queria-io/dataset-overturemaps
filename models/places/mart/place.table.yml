schema: places
name: place
title: 日本の POI
description: |-
  Overture Maps places テーマの日本の施設です。1 行が 1 施設で、名称・カテゴリ・住所・電話番号と、市区町村コード・メッシュコード・建物の ID を持ちます。

  - 件数を数えるときは exclude_reason が NULL の行に絞ってください。重複や閉店した施設の行が残っています
  - 営業状態（operating_status）はほとんどの行で空です
  - source_licenses に Apache-2.0 を含む行には、README にある Foursquare の NOTICE が適用されます
keywords:
- POI
- 施設
- 店舗
- 飲食店
- GIS
annotations: { queria: { themes: [commerce_services] } }
sources:
- path: https://docs.overturemaps.org/guides/places/
fields:
- name: longitude
  title: 経度
- name: latitude
  title: 緯度
- name: name
  title: 名称
  description: 提供元が登録した主たる名称。日本語とは限らない
- name: address
  title: 住所
  description: 提供元が登録した住所の文字列。表記は提供元によって揃っていない
- name: confidence
  title: 確からしさ
  description: その施設が実在する確からしさを Overture が 0〜1 で推定した値
- name: basic_category
  title: 基本カテゴリ
  description: 大まかなカテゴリ（restaurant・cafe・hospital など）
- name: taxonomy_primary
  title: カテゴリ
  description: Overture の分類体系での主カテゴリ。basic_category より細かい
- name: name_ja
  title: 名称（日本語）
  description: 言語別の名称のうち日本語
- name: phones
  title: 電話番号
  description: 複数ある場合は半角スペース区切り
- name: websites
  title: Web サイト
  description: 複数ある場合は半角スペース区切り
- name: release
  title: リリース
  description: 取り込んだ Overture のリリース名（YYYY-MM-DD.N）
- name: id
  title: GERS ID
  description: Overture の GERS ID。リリースをまたいで同じ施設に同じ ID
- name: name_en
  title: 名称（英語）
  description: 言語別の名称のうち英語
- name: taxonomy_hierarchy
  title: カテゴリの階層
  description: 主カテゴリを最上位から並べたもの。「 > 」区切り
- name: operating_status
  title: 営業状態
  description: open・permanently_closed など。ほとんどの行で NULL
- name: brand_name
  title: ブランド名
- name: brand_wikidata
  title: ブランドの Wikidata ID
- name: address_locality
  title: 市区町村
- name: address_region
  title: 都道府県
- name: postal_code
  title: 郵便番号
  annotations: { queria: { semantic: { role: entity, name: postal_code } } }
- name: source_datasets
  title: 提供元
  description: 属性を提供したデータセット名。「, 」区切り
- name: source_licenses
  title: ライセンス
  description: このレコードに適用されるライセンス。「, 」区切り
- name: prefecture_code
  title: 都道府県コード
  description: 2 桁。都道府県で絞るときはこちらを使います
  annotations: { queria: { semantic: { role: entity, name: prefecture } } }
- name: local_government_code
  title: 全国地方公共団体コード
  description: 6 桁。施設の位置が入る市区町村（政令市は区）
  annotations: { queria: { semantic: { role: entity, name: city } } }
- name: building_id
  title: 建物の GERS ID
  description: 施設の位置が入る建物の building_id
- name: mesh1
  title: 1 次メッシュコード
  description: 施設の位置が入る JIS X 0410 の 1 次メッシュ（約 80km 四方）
  annotations: { queria: { semantic: { role: entity, name: mesh } } }
- name: mesh2
  title: 2 次メッシュコード
  description: 施設の位置が入る JIS X 0410 の 2 次メッシュ（約 10km 四方）
  annotations: { queria: { semantic: { role: entity, name: mesh } } }
- name: mesh3
  title: 3 次メッシュコード
  description: 施設の位置が入る JIS X 0410 の 3 次メッシュ（基準地域メッシュ、約 1km 四方）
  annotations: { queria: { semantic: { role: entity, name: mesh } } }
- name: duplicate_of
  title: 重複先の GERS ID
  description: 重複と判定したとき、残す側の行の id
- name: exclude_reason
  title: 除く理由
  description: 数えるときに除く理由（closed・duplicate・low_confidence）
- name: geometry
  title: ジオメトリ
  description: 施設の位置を表す POINT
