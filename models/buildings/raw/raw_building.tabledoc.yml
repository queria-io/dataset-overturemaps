title: 日本の建物（Overture のスキーマのまま）
description: |-
  buildings.building と同じ建物を、Overture のスキーマのまま全列で持ちます。外壁・屋根の色や素材などはここにあります。

  - 列の意味は Overture のスキーマのリファレンスを参照してください
  - release 列だけは Queria が追加した、取り込み元のリリース名です
