version: 2

models:
- name: building
  description: Overture Maps buildings テーマの日本の建物。1行が1棟。メッシュコードと地方公共団体コードを付けてある。
  access: public
  columns:
  - name: building_id
    data_tests:
    - not_null
    - unique
  - name: source_dataset
    data_tests:
    - not_null
  - name: lon
    data_tests:
    - not_null
  - name: lat
    data_tests:
    - not_null
  - name: mesh3
    data_tests:
    - not_null
  - name: geometry
    data_tests:
    - not_null
  - name: release
    data_tests:
    - not_null
- name: building_part
  description: Overture Maps buildings テーマの日本の建物の部分。1行が1部分。
  access: public
  columns:
  - name: part_id
    data_tests:
    - not_null
    - unique
  - name: building_id
    data_tests:
    - not_null
  - name: geometry
    data_tests:
    - not_null
