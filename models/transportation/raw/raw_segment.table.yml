title: 日本の道路区間（Overture のスキーマのまま）
description: |-
  Overture Maps の日本の道路区間を、Overture のスキーマのまま全列で持ちます。経路計算には transportation.road_edge を使います。

  - 列の意味は Overture のスキーマのリファレンスを参照してください
  - release 列だけは Queria が追加した、取り込み元のリリース名です
