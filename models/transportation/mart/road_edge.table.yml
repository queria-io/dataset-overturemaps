schema: transportation
name: road_edge
title: 道路網の辺
description: |-
  日本の道路網を経路計算に使える形にしたものです。道路を交差点ごとに区切った 1 本が 1 行で、徒歩・自転車・車で通れるかと車の一方通行を持ちます。

  - from_node と to_node が transportation.road_node を指します
  - mesh2 で絞ると周りの道だけを読めます
  - 時間帯や車種の条件付きの規制は反映していません
keywords:
- 道路
- 道路網
- 経路
- 到達圏
- 商圏
- 一方通行
- GIS
annotations: { queria: { themes: [transport_tourism] } }
sources:
- path: https://docs.overturemaps.org/guides/transportation/
primary_key: [edge_id]
fields:
- name: edge_id
  title: 辺 ID
  description: 2 次メッシュの順に振った整数。リリースごとに振り直す
- name: from_node
  title: 始点の節点 ID
  description: road_node の node_id。線の向きの始点側
- name: to_node
  title: 終点の節点 ID
  description: road_node の node_id。元の区間の線の向きの終点側
- name: length_m
  title: 長さ（m）
  description: 楕円体の上で測った線の長さ
- name: class
  title: 道路の種類
  description: motorway・primary・residential・footway など
- name: subclass
  title: 道路の細分類
  description: sidewalk・crosswalk・link など
- name: walk
  title: 徒歩で通れる
  description: 徒歩で通れるなら true
- name: bike
  title: 自転車で通れる
  description: 自転車で通れるなら true
- name: car_forward
  title: 車で from_node から to_node へ通れる
  description: 車で通れる道で、この向きの通行が禁止されていなければ true
- name: car_backward
  title: 車で to_node から from_node へ通れる
  description: 車で逆向きに通れるなら true
- name: speed_limit_kmh
  title: 規制速度（km/h）
  description: 区間全体に効く最高速度。生活道路ではほとんど NULL
- name: is_bridge
  title: 橋
- name: is_tunnel
  title: トンネル
- name: is_link
  title: ランプ・連絡路
- name: mesh1
  title: 1 次メッシュコード
  description: 線の中点が入る JIS X 0410 の 1 次メッシュ（約 80km 四方）
  annotations: { queria: { semantic: { role: entity, name: mesh } } }
- name: mesh2
  title: 2 次メッシュコード
  description: 線の中点が入る 2 次メッシュ（約 10km 四方）
  annotations: { queria: { semantic: { role: entity, name: mesh } } }
- name: gers_id
  title: 元の区間の GERS ID
  description: 区切る前の区間の ID（raw_segment の id）
- name: from_at
  title: 元の区間上の始点の位置
  description: 元の区間の長さを 1 としたときの始点の位置（0〜1）
- name: to_at
  title: 元の区間上の終点の位置
  description: 元の区間の長さを 1 としたときの終点の位置（0〜1）
- name: geometry
  title: ジオメトリ
  description: 辺の形を表す LINESTRING
- name: release
  title: リリース
  description: 取り込んだ Overture のリリース名（YYYY-MM-DD.N）
