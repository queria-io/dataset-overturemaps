schema: base
name: land_use
title: 日本の土地利用
description: |-
  Overture Maps base テーマの日本の土地利用です。1 行が 1 区画で、住宅地・農地・公園・学校の敷地・墓地などを面で持ちます。

  - 元はほぼ OpenStreetMap で、描かれている範囲は地域によって差が大きいです。市区町村全体の土地利用の割合を出す用途には向きません
  - 市区町村コードは代表点の市区町村の 1 つだけです
  - land_use_id は 2026-09 のリリースで全件振り直されました
keywords:
- 土地利用
- 農地
- 公園
- 住宅地
- 地方公共団体コード
- メッシュ
- GIS
annotations: { queria: { themes: [land_climate] } }
sources:
- path: https://docs.overturemaps.org/guides/base/
fields:
- name: land_use_id
  title: GERS ID
  description: Overture の GERS ID。2026-09 に全件振り直されました
- name: subtype
  title: 種類の大分類
  description: residential・agriculture・park・education など
- name: class
  title: 種類
  description: residential・farmland・park・grass・school など
- name: name
  title: 名称
  description: 主たる名称。名前の付いた地物だけ（公園名・学校名など）
- name: level
  title: 階層
  description: 地面からの相対的な高さの順位（OSM の layer）。高架は正、地下は負。多くの行で NULL
- name: surface
  title: 表面の素材
  description: 運動場の舗装の種類など。多くの行で NULL
- name: elevation
  title: 標高（m）
  description: ほぼすべての行で NULL
- name: wikidata
  title: Wikidata ID
  description: 地物に紐づく Wikidata の項目。多くの行で NULL
- name: source_dataset
  title: 提供元
  description: 地物の提供元。日本ではほぼ OpenStreetMap
- name: geometry_type
  title: 形状の種類
  description: ほぼすべてが POLYGON・MULTIPOLYGON
- name: area_m2
  title: 面積（m²）
  description: 外形の面積を楕円体の上で測ったもの。LINESTRING の区画は 0
- name: prefecture_code
  title: 都道府県コード
  description: 2桁。代表点が入る市区町村の都道府県
  annotations: { queria: { semantic: { role: entity, name: prefecture } } }
- name: local_government_code
  title: 全国地方公共団体コード
  description: 6 桁。代表点が入る市区町村（政令市は区）
  annotations: { queria: { semantic: { role: entity, name: city } } }
- name: longitude
  title: 経度
  description: 代表点（区画の上に取った点）
- name: latitude
  title: 緯度
  description: 代表点（区画の上に取った点）
- name: mesh1
  title: 1 次メッシュコード
  description: 代表点が入る JIS X 0410 の 1 次メッシュ（約 80km 四方）
  annotations: { queria: { semantic: { role: entity, name: mesh } } }
- name: mesh2
  title: 2 次メッシュコード
  description: 代表点が入る JIS X 0410 の 2 次メッシュ（約 10km 四方）
  annotations: { queria: { semantic: { role: entity, name: mesh } } }
- name: mesh3
  title: 3 次メッシュコード
  description: 代表点が入る 3 次メッシュ（約 1km 四方）。行はこの順です
  annotations: { queria: { semantic: { role: entity, name: mesh } } }
- name: geometry
  title: ジオメトリ
  description: 区画の POLYGON / MULTIPOLYGON（一部 LINESTRING）
- name: release
  title: リリース
  description: 取り込んだ Overture のリリース名（YYYY-MM-DD.N）
