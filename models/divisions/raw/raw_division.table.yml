schema: divisions
name: raw_division
title: 日本の行政区画（Overture のスキーマのまま）
description: |-
  divisions.division と同じ区画を、Overture のスキーマのまま全列で持ちます。階層（hierarchies）や Wikidata ID などはここにあります。

  - 列の意味は Overture のスキーマのリファレンスを参照してください
  - release 列だけは Queria が追加した、取り込み元のリリース名です
