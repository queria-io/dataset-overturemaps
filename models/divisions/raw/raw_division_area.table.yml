schema: divisions
name: raw_division_area
title: 日本の行政区画のポリゴン（Overture のスキーマのまま）
description: Overture Maps divisions テーマの division_area のうち country = 'JP' のもの。divisions.raw_division の区画のポリゴンで、division_id がその区画を指す。陸地だけの形（is_land）と領海を含む形（is_territorial）が別の行になることがある。列の意味は Overture のスキーマのリファレンス（https://docs.overturemaps.org/schema/reference/divisions/division_area/）を参照。release 列だけは Queria が足した取り込み元のリリース名。
