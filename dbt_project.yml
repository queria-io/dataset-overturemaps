name: "overturemaps"
version: "1.0.0"

profile: "overturemaps"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros", "shared/macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  overturemaps:
    +database: overturemaps
    places:
      raw:
        +materialized: table
      # mart も実体化する。view だと st_x / st_y が読むたびに評価され、spatial 拡張を
      # 読み込んでいないブラウザの DuckDB からは統計も SQL も通らない
      mart:
        +materialized: table
