name: "overturemaps"
version: "1.0.0"

profile: "overturemaps"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros", "shared/macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  overturemaps:
    +database: overturemaps
    places:
      # 行グループを 2 万行にする。位置の順に並べても、既定の 12 万行ごとでは 1 つの行グループが
      # 広い範囲にまたがり、地図の中心から 5km の検索でも 25 個中 7 個を読んでいた (2026-10)
      +pre-hook: "CALL overturemaps.set_option('parquet_row_group_size', 20000, schema => 'places')"
      raw:
        +materialized: table
      # mart も実体化する。view だと st_x / st_y が読むたびに評価され、spatial 拡張を
      # 読み込んでいないブラウザの DuckDB からは統計も SQL も通らない
      mart:
        +materialized: table
    transportation:
      raw:
        +materialized: table
      mart:
        +materialized: table
    divisions:
      raw:
        +materialized: table
      mart:
        +materialized: table
    buildings:
      raw:
        +materialized: table
      mart:
        +materialized: table
    base:
      raw:
        +materialized: table
      mart:
        +materialized: table
